<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONE DAY AT A TIME</title>
<style>
:root{
  --cream:#e8dfd3;
  --panel:#4b382d;
  --panel-soft:rgba(75,56,45,.88);
  --border:rgba(232,223,211,.45);
  --line:rgba(232,223,211,.36);
  --bg:#211b17;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;overflow-x:hidden}
.dashboard{
  position:relative;
  width:min(1536px,100vw);
  height:min(1024px,66.6667vw);
  margin:0 auto;
  overflow:hidden;
  background:#211b17 url("bg.png") center top / 100% auto no-repeat;
}
.shell{position:relative;width:100%;height:100%;margin:0 auto}

/* Shared panel treatment. Every dashboard box uses the same fill and 1px outline. */
.panel{
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}

/* Header */
.dashboard-title{
  position:absolute;
  left:50%;
  top:3.2%;
  transform:translateX(-50%);
  margin:0;
  color:var(--cream);
  font-size:clamp(22px,2.55vw,39px);
  font-weight:600;
  letter-spacing:.20em;
  line-height:1;
  white-space:nowrap;
  text-align:center;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.dashboard-title:after{
  content:"";
  display:block;
  width:78%;
  height:1px;
  margin:13px auto 0;
  background:rgba(232,223,211,.72);
}

/* Four navigation panels */
.tab-hotspots{
  position:absolute;
  left:50%;
  top:12.9%;
  transform:translateX(-50%);
  width:46.2%;
  height:19.2%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:1.7%;
}
.tab-hotspots .tab{
  min-width:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-soft);
  color:var(--cream);
  cursor:pointer;
  font:500 clamp(12px,1.15vw,18px) Georgia,"Times New Roman",serif;
  letter-spacing:.20em;
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.tab-hotspots .tab:hover{background:rgba(75,56,45,.96)}
.tab-hotspots .tab:focus-visible{outline:1px solid var(--cream);outline-offset:-2px}

/* Middle content: routine + tracker + reserved panel */
.layout-overlay{
  position:absolute;
  left:50%;
  top:34.0%;
  transform:translateX(-50%);
  width:46.2%;
  height:30.0%;
  display:grid;
  grid-template-columns:66.7% 31.3%;
  gap:2%;
}
.left-space{min-width:0;display:block}
.flow-hit{
  position:relative;
  height:100%;
  margin:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-soft);
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  overflow:hidden;
}
.flow-hit:before{
  content:"ROUTINE FLOW";
  position:absolute;
  left:6%;top:7%;
  font-size:clamp(12px,1.1vw,17px);
  letter-spacing:.22em;
  color:var(--cream);
}
.flow-hit:after{
  content:"";
  position:absolute;
  left:6%;right:6%;top:20%;
  height:1px;background:var(--line);
}
.checklist-overlay{
  position:absolute;
  inset:27% 7% 7% 7%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(5,1fr);
  column-gap:12%;
  row-gap:0;
}
.check-item{display:flex;align-items:center;gap:10px;min-width:0}
.check-item input[type=checkbox]{
  width:22px;height:22px;appearance:none;-webkit-appearance:none;
  border:1px solid var(--cream);border-radius:3px;
  background:transparent;cursor:pointer;flex:none;
}
.check-item input[type=checkbox]:checked{background:#414337;border-color:var(--cream)}
.check-item input[type=checkbox]:checked::after{content:"✓";display:block;text-align:center;line-height:20px;color:var(--cream);font-size:14px}
.check-item input[type=text]{
  width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);
  background:transparent;color:var(--cream);outline:none;padding:5px 2px;
  font:15px Georgia,"Times New Roman",serif;
}
.check-item input[type=text]:focus{border-bottom-color:var(--cream)}
.side-stack{
  position:relative;
  height:100%;
  display:grid;
  grid-template-rows:1fr 1fr;
  gap:2%;
}
.stack-panel{
  position:relative;
  min-height:0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-soft);
  box-shadow:0 8px 20px rgba(0,0,0,.16);
  overflow:hidden;
}
.tracker-panel{padding:22% 8% 6%;}
.tracker-panel:before{
  content:"TRACKER";
  position:absolute;
  left:8%;top:7%;
  font-size:clamp(12px,1.05vw,16px);
  letter-spacing:.22em;
}
.tracker-panel:after{
  content:"";
  position:absolute;
  left:8%;right:8%;top:20%;
  height:1px;background:var(--line);
}

/* Right column */
.side-overlay{
  position:absolute;
  left:73.9%;
  top:12.9%;
  width:16.9%;
  height:51.1%;
}
.calendar-overlay{
  position:absolute;
  left:0;right:0;bottom:0;
  height:53.0%;
  padding:12% 7% 5%;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-soft);
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.calendar-overlay:before{
  content:"‹   OCTOBER 2026                                      ›";
  position:absolute;left:7%;right:7%;top:8%;
  font-size:clamp(8px,.72vw,11px);
  letter-spacing:.11em;
  text-align:center;white-space:nowrap;opacity:.95;
}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font:13px Georgia,"Times New Roman",serif;text-align:center}
.calendar-grid div{padding:5px 0;border-radius:50%}
.calendar-grid .today{background:rgba(139,129,119,.65);font-weight:700}

/* Live clock. Same fill and exact same 1px outline as every other panel. */
#liveClock.clock-live{
  position:absolute !important;
  left:73.9% !important;
  top:12.9% !important;
  width:16.9% !important;
  height:18.7% !important;
  z-index:50 !important;
  display:flex !important;
  visibility:visible !important;
  opacity:1 !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
  padding:0 !important;
  margin:0 !important;
  box-sizing:border-box !important;
  overflow:hidden !important;
  color:var(--cream) !important;
  background:var(--panel-soft) !important;
  border:1px solid var(--border) !important;
  border-radius:12px !important;
  box-shadow:0 8px 20px rgba(0,0,0,.16) !important;
  pointer-events:none !important;
  text-shadow:0 1px 3px rgba(0,0,0,.5) !important;
}
#liveClock .live-time{display:block;color:var(--cream);font:500 clamp(18px,2vw,30px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:.035em;white-space:nowrap}
#liveClock .live-date{display:block;color:var(--cream);font:15px/1.2 Georgia,"Times New Roman",serif;margin-top:7px;letter-spacing:.02em;white-space:nowrap}

/* Vision board. Its left/right edges are tied to the centered content system. */
.vision-overlay{
  position:absolute;
  left:21.8%;
  top:67.0%;
  width:69.0%;
  height:29.0%;
  margin:0;
  padding:7% 2.2% 2.2%;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel-soft);
  box-shadow:0 8px 20px rgba(0,0,0,.16);
}
.vision-overlay:before{
  content:"VISION BOARD";
  position:absolute;left:2.8%;top:7%;
  font-size:clamp(12px,1.05vw,16px);letter-spacing:.22em;
}
.vision-overlay:after{
  content:"";
  position:absolute;left:2.8%;right:2.8%;top:20%;height:1px;background:var(--line);
}
.vision-overlay input[type=file]{display:none}
.vision-content{
  height:100%;border:1px dashed rgba(232,223,211,.45);border-radius:8px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;
}
.vision-content img{width:100%;height:100%;object-fit:contain;display:none}
.add-image{border:1px solid rgba(232,223,211,.55);background:rgba(75,56,45,.35);color:var(--cream);padding:10px 18px;border-radius:20px;cursor:pointer;font:13px Georgia,"Times New Roman",serif;letter-spacing:.08em}

@media(max-width:700px){
  .dashboard{width:100vw;height:66.6667vw;background-size:100% auto;overflow:visible}
  .dashboard-title{font-size:clamp(18px,3.8vw,26px);letter-spacing:.16em}
  .dashboard-title:after{margin-top:8px}
  .tab-hotspots{width:46.2%;gap:1.7%}
  .tab-hotspots .tab{font-size:clamp(8px,1.7vw,13px)}
  #liveClock .live-time{font-size:clamp(11px,2.6vw,20px)}
  #liveClock .live-date{font-size:clamp(7px,1.4vw,11px);margin-top:4px}
  .calendar-grid{font-size:9px;gap:1px}
  .calendar-grid div{padding:2px 0}
  .check-item input[type=checkbox]{width:16px;height:16px}
  .check-item input[type=checkbox]:checked::after{line-height:14px;font-size:10px}
  .check-item input[type=text]{font-size:9px}
  .notes-overlay textarea{font-size:10px}
}
</style>
</head>
<body>
<div class="dashboard">
  <main class="shell">
    <h1 class="dashboard-title">ONE DAY AT A TIME</h1>
    <div class="tab-hotspots">
      <button class="tab" onclick="navigate('keerthi')" aria-label="Keerthi">KEERTHI</button>
      <button class="tab" onclick="navigate('dhaksha')" aria-label="Dhaksha">DHAKSHA</button>
      <button class="tab" onclick="navigate('home')" aria-label="Home">HOME</button>
      <button class="tab" onclick="navigate('money')" aria-label="Money">₹</button>
    </div><section class="layout-overlay">
      <div class="left-space">
        <section class="flow-hit" aria-label="Routine Flow checklist">
          <div class="checklist-overlay" id="checklist"></div>
        </section>
      </div>
      <section class="side-stack" aria-label="Dashboard panels">
        <section class="stack-panel tracker-panel" aria-label="Tracker"></section>
        <section class="stack-panel" aria-label="Reserved panel"></section>
      </section>
      </section>

    <aside class="side-overlay" aria-label="Current month calendar">
      <section class="calendar-overlay" aria-label="Current month calendar">
        <div class="calendar-grid" id="calendar"></div>
      </section>
    </aside>

    <section class="vision-overlay" aria-label="Vision Board">
      <div class="vision-content">
        <input id="visionFile" type="file" accept="image/*">
        <img id="visionImage" alt="Vision board image">
        <button class="add-image" id="addImage">＋ ADD AN IMAGE</button>
      </div>
    </section>
  <div class="clock-live" id="liveClock" aria-label="Live India Standard Time">
  <div class="live-time" id="liveTime">TIME</div>
  <div class="live-date" id="liveDate">IST · LIVE</div>
</div>
  </main>
</div>

<script>
const TZ='Asia/Kolkata';

function updateLiveClock(){
  const now = new Date();

  // IST = UTC + 5 hours 30 minutes.
  const istMs = now.getTime() + (5.5 * 60 * 60 * 1000);
  const ist = new Date(istMs);

  let hours = ist.getUTCHours();
  const minutes = String(ist.getUTCMinutes()).padStart(2, '0');
  const seconds = String(ist.getUTCSeconds()).padStart(2, '0');
  const period = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12 || 12;

  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const timeEl = document.getElementById('liveTime');
  const dateEl = document.getElementById('liveDate');

  if (timeEl) {
    timeEl.textContent = `${hours}:${minutes}:${seconds} ${period}`;
  }
  if (dateEl) {
    dateEl.textContent =
      `${days[ist.getUTCDay()]}, ${ist.getUTCDate()} ${months[ist.getUTCMonth()]} ${ist.getUTCFullYear()} · IST`;
  }
}
function buildCalendar(){
  const now=new Date();
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric'}).formatToParts(now);
  const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));
  const y=Number(v.year),m=Number(v.month)-1,today=Number(v.day);
  const first=new Date(y,m,1).getDay();
  const total=new Date(y,m+1,0).getDate();
  let out='';
  for(let i=0;i<first;i++)out+='<div></div>';
  for(let d=1;d<=total;d++)out+=`<div class="${d===today?'today':''}">${d}</div>`;
  document.getElementById('calendar').innerHTML=out;
}


function navigate(section){
  localStorage.setItem('dashboard-section',section);

  const buttons = document.querySelectorAll('.tab');
  buttons.forEach(b=>b.style.outline='');

  const map={keerthi:0,dhaksha:1,home:2,money:3};
  if(map[section]!==undefined && buttons[map[section]]){
    buttons[map[section]].style.outline='2px solid rgba(232,223,211,.65)';
  }

  if(section === 'home'){ window.location.href='home.html'; return; }
}
function saveChecklist(){
  const data=[...document.querySelectorAll('.check-item')].map(x=>({checked:x.querySelector('input[type=checkbox]').checked,text:x.querySelector('input[type=text]').value}));
  localStorage.setItem('routine-checklist',JSON.stringify(data));
}
function loadChecklist(){
  const box=document.getElementById('checklist');
  const saved=JSON.parse(localStorage.getItem('routine-checklist')||'null');
  for(let i=0;i<10;i++){
    const item=saved?.[i]||{checked:false,text:''};
    box.insertAdjacentHTML('beforeend',`<label class="check-item"><input type="checkbox" ${item.checked?'checked':''}><input type="text" value="${String(item.text).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></label>`);
  }
  box.querySelectorAll('input').forEach(el=>el.addEventListener('input',saveChecklist));
  box.querySelectorAll('input[type=checkbox]').forEach(el=>el.addEventListener('change',saveChecklist));
}
function loadVision(){
  const img=document.getElementById('visionImage');
  const saved=localStorage.getItem('vision-image');
  if(saved){img.src=saved;img.style.display='block';document.getElementById('addImage').style.display='none';}
  document.getElementById('addImage').onclick=()=>document.getElementById('visionFile').click();
  document.getElementById('visionFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>{img.src=r.result;img.style.display='block';document.getElementById('addImage').style.display='none';localStorage.setItem('vision-image',r.result);};
    r.readAsDataURL(f);
  };
}
updateLiveClock();
setInterval(updateLiveClock,1000);buildCalendar();loadChecklist();loadVision();
</script>
</body>
</html>
