<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>HOME · ONE DAY AT A TIME</title>

<style>
:root{
  --cream:#e8dfd3;
  --panel:rgba(75,56,45,.88);
  --border:rgba(232,223,211,.55);
  --line:rgba(232,223,211,.38);
  --shadow:0 8px 22px rgba(0,0,0,.18);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  background:#211b17;
  color:var(--cream);
  font-family:Georgia,"Times New Roman",serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

.page{
  min-height:100vh;
  padding:6vh 7vw 8vh;
  background:#211b17 url("back.PNG") center center / cover no-repeat;
}

.container{
  width:min(900px,100%);
  margin:0 auto;
}

.title{
  margin:0;
  text-align:center;
  font-size:clamp(26px,4vw,42px);
  font-weight:700;
  letter-spacing:.20em;
  text-shadow:0 1px 3px rgba(0,0,0,.45);
}

.subtitle{
  margin:12px 0 35px;
  text-align:center;
  font-size:13px;
  letter-spacing:.14em;
  opacity:.85;
}

/* Task groups */

.task-group{
  margin-bottom:18px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.group-header{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 22px;
  border:0;
  background:transparent;
  color:var(--cream);
  cursor:pointer;
  font:500 16px Georgia,"Times New Roman",serif;
  letter-spacing:.18em;
  text-align:left;
}

.group-header span:last-child{
  font-size:18px;
  transition:transform .2s ease;
}

.task-group.open .group-header span:last-child{
  transform:rotate(180deg);
}

.group-content{
  display:none;
  padding:0 22px 20px;
}

.task-group.open .group-content{
  display:block;
}

.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-top:1px solid var(--line);
  cursor:pointer;
  font-size:14px;
}

.task input{
  width:20px;
  height:20px;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
  border:1px solid var(--cream);
  border-radius:4px;
  background:transparent;
  cursor:pointer;
  flex:none;
}

.task input:checked{
  background:#414337;
}

.task input:checked::after{
  content:"✓";
  display:block;
  text-align:center;
  line-height:18px;
  color:var(--cream);
  font-size:13px;
}

.confirm{
  width:100%;
  margin-top:12px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(75,56,45,.45);
  color:var(--cream);
  cursor:pointer;
  font:500 12px Georgia,"Times New Roman",serif;
  letter-spacing:.18em;
}

.confirm:hover{
  background:rgba(75,56,45,.75);
}

/* Today */

.section-title{
  margin:38px 0 12px;
  font-size:13px;
  letter-spacing:.20em;
}

.today,
.history{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:20px 22px;
}

.empty{
  opacity:.65;
  font-size:13px;
}

.completed-item{
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.completed-item:last-child{
  border-bottom:0;
}

.date-heading{
  margin-top:18px;
  padding-bottom:8px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  letter-spacing:.10em;
}

.back{
  display:block;
  margin:30px auto 0;
  padding:10px 22px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--panel);
  color:var(--cream);
  text-decoration:none;
  text-align:center;
  width:max-content;
  font-size:12px;
  letter-spacing:.12em;
}

@media(max-width:700px){

  .page{
    padding:5vh 5vw 7vh;
  }

  .group-header{
    padding:16px 18px;
  }

  .group-content{
    padding:0 18px 18px;
  }

  .today,
  .history{
    padding:17px 18px;
  }
}
</style>
</head>

<body>

<div class="page">

  <main class="container">

    <h1 class="title">HOME</h1>

    <div class="subtitle" id="todayDate"></div>

    <!-- TRASH -->

    <section class="task-group">

      <button class="group-header" type="button">
        <span>TRASH</span>
        <span>⌄</span>
      </button>

      <div class="group-content">

        <label class="task">
          <input type="checkbox" value="Wet waste">
          <span>Wet waste</span>
        </label>

        <label class="task">
          <input type="checkbox" value="Dry waste">
          <span>Dry waste</span>
        </label>

        <label class="task">
          <input type="checkbox" value="Rejections">
          <span>Rejections</span>
        </label>

        <button class="confirm" type="button">
          CONFIRM
        </button>

      </div>

    </section>

    <!-- LAUNDRY -->

    <section class="task-group">

      <button class="group-header" type="button">
        <span>LAUNDRY</span>
        <span>⌄</span>
      </button>

      <div class="group-content">

        <label class="task">
          <input type="checkbox" value="Bed linen">
          <span>Bed linen</span>
        </label>

        <label class="task">
          <input type="checkbox" value="K's laundry">
          <span>K's laundry</span>
        </label>

        <label class="task">
          <input type="checkbox" value="D's laundry">
          <span>D's laundry</span>
        </label>

        <button class="confirm" type="button">
          CONFIRM
        </button>

      </div>

    </section>

    <!-- TODAY -->

    <h2 class="section-title">TODAY</h2>

    <section class="today" id="todayList">
      <div class="empty">
        Nothing confirmed yet today.
      </div>
    </section>

    <!-- HISTORY -->

    <h2 class="section-title">HISTORY</h2>

    <section class="history" id="historyList">
      <div class="empty">
        No previous records yet.
      </div>
    </section>

    <a class="back" href="index.html">
      ← BACK TO DASHBOARD
    </a>

  </main>

</div>

<script>

const TZ='Asia/Kolkata';

function getDateKey(){

  const parts=new Intl.DateTimeFormat(
    'en-CA',
    {
      timeZone:TZ,
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  ).formatToParts(new Date());

  const v=Object.fromEntries(
    parts.map(p=>[p.type,p.value])
  );

  return `${v.year}-${v.month}-${v.day}`;
}

function getDateLabel(){

  return new Intl.DateTimeFormat(
    'en-IN',
    {
      timeZone:TZ,
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  ).format(new Date());
}

function loadRecords(){

  return JSON.parse(
    localStorage.getItem('home-records')||'{}'
  );

}

function saveRecords(records){

  localStorage.setItem(
    'home-records',
    JSON.stringify(records)
  );

}

function renderToday(){

  const records=loadRecords();

  const today=getDateKey();

  const list=document.getElementById('todayList');

  const items=records[today]||[];

  if(!items.length){

    list.innerHTML=
      '<div class="empty">Nothing confirmed yet today.</div>';

    return;
  }

  list.innerHTML=items.map(item=>`
    <div class="completed-item">
      ✓ ${item.group} · ${item.task}
    </div>
  `).join('');

}

function renderHistory(){

  const records=loadRecords();

  const history=document.getElementById('historyList');

  const dates=Object.keys(records)
    .filter(date=>date!==getDateKey())
    .sort()
    .reverse();

  if(!dates.length){

    history.innerHTML=
      '<div class="empty">No previous records yet.</div>';

    return;
  }

  history.innerHTML=dates.map(date=>{

    const items=records[date];

    const formatted=new Intl.DateTimeFormat(
      'en-IN',
      {
        timeZone:TZ,
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    ).format(new Date(date+'T12:00:00'));

    return `
      <div class="date-heading">
        ${formatted}
      </div>

      ${items.map(item=>`
        <div class="completed-item">
          ✓ ${item.group} · ${item.task}
        </div>
      `).join('')}
    `;

  }).join('');

}

document.getElementById('todayDate').textContent=
  getDateLabel();

document.querySelectorAll('.group-header')
.forEach(button=>{

  button.addEventListener('click',()=>{

    button
      .closest('.task-group')
      .classList.toggle('open');

  });

});

document.querySelectorAll('.confirm')
.forEach(button=>{

  button.addEventListener('click',()=>{

    const group=
      button.closest('.task-group');

    const groupName=
      group.querySelector('.group-header span').textContent;

    const selected=[
      ...group.querySelectorAll(
        'input[type="checkbox"]:checked'
      )
    ];

    if(!selected.length)return;

    const records=loadRecords();

    const today=getDateKey();

    if(!records[today]){
      records[today]=[];
    }

    selected.forEach(input=>{

      const exists=records[today].some(
        item=>
          item.group===groupName &&
          item.task===input.value
      );

      if(!exists){

        records[today].push({
          group:groupName,
          task:input.value
        });

      }

      input.checked=false;

    });

    saveRecords(records);

    renderToday();
    renderHistory();

    group.classList.remove('open');

  });

});

renderToday();
renderHistory();

</script>

</body>
</html>
